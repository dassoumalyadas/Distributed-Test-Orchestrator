services:
  # Message Broker & Session Cache
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Playwright Worker Fleet (Scale with --scale worker=10)
  worker:
    build:
      context: ./playwright-suite
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: on-failure
